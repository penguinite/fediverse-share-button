<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Fediverse Sharing Button</title>
        <link rel="stylesheet" href="share/style.css">
    </head>
    <body>
        <main>
            <h1>Fediverse Sharing Button</h1>
            <noscript>
                <article class="error">
                    <h2>Sorry! This application only works with JavaScript enabled!</h2>
                </article>
            </noscript>
            <div id="app">
                <article class="invisible error"></article>
                <article class="invisible status"><p>Type the URL of your instance in the text box below.</p></article>
                <input class="invisible" type="url" id="instance" placeholder="https://mastodon.example"/>
                <button class="invisible" onclick="share();">Share</button>
            </div>
            <footer>
                <p>Originally created and developed by <a href="stefanbohacek.com">Stefan Bohacek</a></p>
                <p>This is a custom fork heavily modifying the original project, please support the original author by donating <a href="https://stefanbohacek.com/support-my-work/">here</a></p>
            </footer>
            <script class="fsb-script" src="share/script.js" defer></script>
        </main>
    </body>
</html>
